[build]
publish = "." # raíz del repo
# Genera 2026/js/env.js con las credenciales del proyecto (ver el script).
# Declarado aquí y no solo en la UI de Netlify: netlify.toml tiene precedencia
# y así el comando queda versionado junto al script que invoca.
command = "node scripts/generate-env.cjs"

# publish = "." expone todo el repo; estas carpetas son herramientas de
# desarrollo (proxy local, tests, scripts de build) y nunca deben servirse.
[[redirects]]
from = "/local_server/*"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/tests/*"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/scripts/*"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/"
to = "/2026/"
status = 301

[[redirects]]
from = "/2026/form/index.html"
to = "/2026/registro.html"
status = 301

[[redirects]]
from = "/2026/form/speaker.html"
to = "/2026/ponentes.html"
status = 301

# La página de ponentes se llamó speaker.html hasta septiembre de 2026.
[[redirects]]
from = "/2026/speaker.html"
to = "/2026/ponentes.html"
status = 301

[[redirects]]
from = "/2026/voluntariado"
to = "/2026/voluntariado/"
status = 301

[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "SAMEORIGIN"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), geolocation=(), microphone=()"

# Política inicialmente en observación para la edición activa. Las ediciones
# archivadas conservan recursos distintos y necesitan una revisión separada.
[[headers]]
for = "/2026/*"
  [headers.values]
  Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-src 'none'; frame-ancestors 'self'; form-action 'self'"

# CSS: caché de una semana.
[[headers]]
for = "/*.css"
  [headers.values]
  Cache-Control = "public, max-age=604800"

# Los scripts cambian durante la edición: revalidar antes de reutilizarlos.
# La URL versionada en los formularios invalida las copias antiguas ya cacheadas.
[[headers]]
for = "/*.js"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# La página 404.html en la raíz la sirve Netlify automáticamente.
