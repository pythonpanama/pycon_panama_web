name: Validate public site

on:
  pull_request:
    paths:
      - "2026/**"
      - "scripts/validate_site.py"
      - "sitemap.xml"
      - "robots.txt"
      - "netlify.toml"
      - ".github/workflows/site-validation.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate structure, local links, external links and metadata
        run: python3 scripts/validate_site.py
      - name: Validate JavaScript syntax
        run: |
          node --check 2026/js/main.js
          node --check 2026/js/supabase-config.js
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
