    <main id="contenido-principal" class="container" tabindex="-1">
        <h1>Registro de asistentes</h1>
        <p>Regístrate para asistir al evento.</p>
        <div class="form-card">
        <form id="registro-form" data-table="registrations">
            <input type="hidden" name="page" value="Registro - PyCon Panamá 2026">
            <label class="form-label">Nombre completo <input class="form-control" name="name" required></label>
            <label class="form-label">Email <input class="form-control" type="email" name="email" required></label>
            <label class="form-label">Organización <input class="form-control" name="organization"></label>
            <label class="form-label">Rol / Perfil
                <select class="form-select" name="role">
                    <option value="estudiante">Estudiante</option>
                    <option value="profesional">Profesional</option>
                    <option value="otro">Otro</option>
                </select>
            </label>
            <label class="form-label">Necesidades de accesibilidad <input class="form-control" name="accessibility"></label>
            <label class="form-label">Teléfono (opcional) <input class="form-control" name="phone"></label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="consent_photos" name="consent_photos" value="1">
                <label class="form-check-label" for="consent_photos">Autorizo uso de imágenes y videos donde aparezca</label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg">Registrarme</button>
            </div>
            <div id="form-message" role="status" aria-live="polite"></div>
        </form>
        </div>
    </main>
