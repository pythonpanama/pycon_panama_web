<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Proponer charla - PyCon Panamá 2026</title>
    <meta name="description" content="Formulario para proponer ponencias en PyCon Panamá 2026">
    <link rel="stylesheet" href="/2026/css/style.css">
</head>
<body>
    <main class="container">
        <h1>Proponer ponencia</h1>
        <p>Completa el formulario para enviar tu propuesta de charla.</p>
        <form id="speaker-form" data-table="speakers">
            <label>Nombre completo <input name="name" required></label>
            <label>Email <input type="email" name="email" required></label>
            <label>Afiliación / Empresa <input name="affiliation"></label>
            <label>Biografía corta <textarea name="bio" rows="3"></textarea></label>
            <label>Título de la ponencia <input name="title" required></label>
            <label>Resumen / Abstract <textarea name="abstract" rows="6" required></textarea></label>
            <label>Duración propuesta
                <select name="duration">
                    <option value="20">20 min</option>
                    <option value="30">30 min</option>
                    <option value="45">45 min</option>
                </select>
            </label>
            <label>Idioma
                <select name="language">
                    <option value="es">Español</option>
                    <option value="en">Inglés</option>
                </select>
            </label>
            <label>Enlaces (GitHub, Slides, Portfolio) <input name="links"></label>
            <label>
                <input type="checkbox" name="consent" value="1" required>
                Doy mi consentimiento para publicar mi propuesta en la web
            </label>
            <div>
                <button type="submit">Enviar propuesta</button>
            </div>
            <div id="form-message" role="status" aria-live="polite"></div>
        </form>
    </main>

    <script src="/form/config.js"></script>
    <script src="/form/js/form-submit.js"></script>
</body>
</html>
